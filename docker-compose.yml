# Web app + PostgreSQL:  docker compose up --build   then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: riceleaf
      POSTGRES_USER: riceleaf
      POSTGRES_PASSWORD: riceleaf-dev-password
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riceleaf"]
      interval: 5s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "replace-me-with-a-long-random-string"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "0"   # local HTTP only; remove behind HTTPS
      DJANGO_SECURE_COOKIES: "0"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: riceleaf
      DB_USER: riceleaf
      DB_PASSWORD: riceleaf-dev-password
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
  media:
